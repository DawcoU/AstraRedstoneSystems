plugins {
    id 'java'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'pl.dawcou'
version = '1.7.0'

repositories {
    mavenCentral()
    maven { url = 'https://repo.papermc.io/repository/maven-public/' }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.20.4-R0.1-SNAPSHOT'

    // Biblioteka bStats
    implementation 'org.bstats:bstats-bukkit:3.2.1'

    // Kyori Adventure API oraz Minidown/Legacy text (dla pełnego wsparcia komponentów)
    implementation 'net.kyori:adventure-platform-bukkit:4.4.1'
    implementation 'net.kyori:adventure-api:4.26.1'
    implementation 'net.kyori:adventure-text-minimessage:4.26.1'
    implementation 'net.kyori:adventure-text-serializer-legacy:4.26.1'
    implementation 'net.kyori:adventure-text-serializer-plain:4.26.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'

    def pluginVersion = project.version.toString()

    filesMatching('plugin.yml') {
        expand(version: pluginVersion)
    }
}

shadowJar {
    archiveClassifier.set('')
    archiveFileName = "${project.name}.jar"

    // Relokacje bibliotek
    relocate 'org.bstats', 'pl.dawcou.astrars.libs.bstats'
    relocate 'net.kyori', 'pl.dawcou.astrars.libs.kyori'
}

tasks.build {
    dependsOn shadowJar
}