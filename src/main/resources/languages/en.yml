# You can use color codes (e.g., &a, &c, &l), HEX codes, gradients, and placeholders like %type%, %val%, %count%.

messages:


  # --- General / System ---
  general:
    only-players: "&cThis command is not available from console!"
    no-permission: "&cYou do not have permission!"
    reload-success: "&aConfiguration reloaded successfully!"


  # --- Main Gate Command /bramka ---
  gate-cmd:
    usage: "&cUsage: &6/bramka <Category> <Type> <Parameter>"
    need-channel: "&cYou must specify a channel! <channel1,channel2...>"
    provide-limit: "&cPlease provide a limit!"
    provide-value: "&cPlease provide a value!"
    provide-text: "&cPlease provide text!"
    provide-range: "&cPlease provide a range (1-15)!"
    provide-mode: "&cPlease provide a mode!"
    provide-sign: "&cPlease provide an operator! (>, <, ==, !=, >=, <=)"
    provide-string-sign: "&cPlease provide an operator! (EQUALS, EQUALS_IGNORE_CASE, CONTAINS, STARTS_WITH, ENDS_WITH, EMPTY)"
    provide-time: "&cPlease provide a time (5t-10s)!"
    provide-unit: "&cPlease provide a unit: &e't' &7(ticks) &cor &e's' &7(seconds)&c!"
    provide-delay: "&cPlease provide a delay (1t-10s)!"
    provide-frequency: "&cPlease provide a frequency (1t-10s)!"
    invalid-sign: "&cThis is not a valid mathematical operator!"
    invalid-string-sign: "&cThis is not a valid string operator!"
    invalid-time: "&cPlease provide a valid format (e.g., 10s)!"
    wrong-format: "&cInvalid format! Use: min-max (e.g., 0-10)"
    not-a-number: "&cThis is not a number!"
    negative-number: "&cYou cannot enter a negative number!"
    min-greater-than-max: "&cMin value cannot be greater than max value!"
    limit-range: "&cLimit must be in range 1-1000!"
    range-bounds: "&cRange must be in range 1-15!"
    repeater-ticks-range: "&cDelay in ticks must be between 1t and 200t (10s)!"
    repeater-seconds-range: "&cDelay in seconds must be between 1s and 10s!"
    clock-ticks-range: "&cFrequency in ticks must be between 1t and 200t (10s)!"
    clock-seconds-range: "&cFrequency in seconds must be between 1s and 10s!"


  # --- Gate Interaction (Place/Break/Items) ---
  gate:
    prefix-item: "&4Gate: &c"
    received: "&aYou received a gate: &e%type%"
    placed: "&aPlaced gate &e%type% &6Output: &e%out%"
    removed: "&cGate &6%type% &chas been removed!"
    unknown-type: "&cUnknown gate type!"
    unsupported: "&cGate &6%type% &cWill not work properly on this server"
    power-break-deny: "&cThis is a power block powering the gate output!"


  # --- Gate Editing GUI ---
  gui:
    title: "&8Edit: &f%type%"
    saved: "&aGate settings have been saved!"
    value-changed: "&aChanged value for gate &e%type% &fto: &f%val%"

    status-inputs: "&eMode: &f%val% Inputs &7(Click to switch)"
    status-time: "&7Current time: &e%val% Ticks"
    status-value: "&7Current value: &e%val%"
    status-limit: "&7Current limit: &e%val%"
    status-range: "&7Current range: &e%val% blocks"
    status-random: "&7Range: &e%min% &7to &e%max%"
    status-mode: "&7Current mode: &e%mode%"


  # --- Selection (Selector) ---
  selector:
    item-name: "&dGate Selector"
    received: "&aYou received a Gate Selector!"
    pos-1: "&ePoint 1 set!"
    pos-2: "&ePoint 2 set!"
    both-required: "&cYou must select both points first!"
    cut: "&aCut area, removed &f%count% &clogic gates"


  # --- Area Editing (Copy/Paste/Rotate/Undo/Redo) ---
  clipboard:
    copy-success: "&aCopied &e%count% &agates to clipboard!"
    empty: "&cYour clipboard is empty! Use /ars copy first"
    paste-success: "&aSuccessfully pasted &e%count% &agates!"
    rotate-success: "&7Rotated clipboard contents by &f%degree% &7degrees"
    invalid-rotate-angle: "&cInvalid angle! Use 90, -90, or 180"
    undo-success: "&aUndone last paste (&7%count% gates&a)"
    nothing-to-undo: "&cYou have nothing to undo!"
    redo-success: "&eRedone last undo (&7%count% &egates)"
    nothing-to-redo: "&cYou have nothing to redo!"


  # --- Schematics ---
  schema:
    specify-action: "&cYou must choose an action! Usage: &e/ars schematic <save/load/delete> [name]"
    specify-name: "&cYou must specify a schematic name! Usage: &e/ars schematic <save/load/delete> [name]"
    invalid-name: "&cSchematic name contains invalid characters! Use only letters, numbers, _, and -"
    not-found: "&cSchematic file named &e%name%.json &cnot found in plugin directory"
    corrupted: "&cSchematic file is empty, corrupted, or has invalid JSON structure"
    file-exists: "&cSchematic file &e%name%.json &calready exists!"
    save-success: "&aSchematic &e%name% &asaved successfully to disk! &7(%count% gates)"
    save-error: "&cA critical error occurred while saving schematic!"
    load-success: "&aSchematic &e%name% &7(%count% gates) &aloaded to clipboard! Run paste command to place it in world"
    deleted: "&aSuccessfully deleted schematic &e%name%.json &cfrom server files"
    delete-error: "&cAn error occurred while deleting file &e%name%.json&c!"